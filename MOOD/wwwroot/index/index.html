<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial,sans-serif;
        }
        .intro{
            position:fixed;
            inset:0;
            background:#f7f3ff;
            display:flex;
            justify-content:center;
            align-items:center;
            z-index:9999;
            animation:introOut 1s ease forwards;
            animation-delay:1.2s;
        }
        .logo{
            font-size:64px;
            font-weight:600;
            letter-spacing:8px;
            color:#222;
            animation:logoIn 1s ease;
        }
        .home{
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#ffffff;
        }
        .home-content{
            text-align:center;
        }
        .home-content h1{
            font-size:50px;
            margin-bottom:20px;
        }
        .home-content p{
            font-size:20px;
            color:#666;
        }
        @keyframes logoIn{
            from{
                opacity:0;
                transform:scale(0.8);
            }
            to{
                opacity:1;
                transform:scale(1);
            }
        }
        @keyframes introOut{
            from{
                opacity:1;
                visibility:visible;
            }
            to{
                opacity:0;
                visibility:hidden;
            }
        }
    </style>
</head>
<body>
    <div class="intro">
        <div class="logo">
            MOOD
        </div>
    </div>
    <main class="home">
        <div class="home-content">
            <h1>MOOD</h1>
            <p>How would you like to continue?</p>
        </div>
    </main>
</body>
</html>
